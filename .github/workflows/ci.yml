name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest src/test_speak.py src/test_speak_server.py -v

      - name: Python syntax check
        run: |
          python -m py_compile src/speak.py
          python -m py_compile src/speak_server.py

      - name: Sanitize check
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\sanitize-check.ps1

      - name: Smoke test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\smoke-test.ps1